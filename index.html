<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBFAF8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="REVNT — rent and list riding gear. Interactive prototype.">
  <title>REVNT Prototype</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Istok+Web:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="side" id="side" aria-label="Screens">
      <header>
        <img class="side-logo" src="assets/logo.png" alt="" width="36" height="42">
        <div>
          <div class="brand">REVNT prototype</div>
          <div class="hint">Tap through the app, or jump to any frame. Esc steps back.</div>
        </div>
        <button class="close-side" id="closeSide" aria-label="Close screen list"><span class="ms">close</span></button>
      </header>
      <nav class="map" id="map"></nav>
      <footer>
        <button class="tbtn" id="restart"><span class="ms">restart_alt</span>Restart</button>
        <div class="theme" role="radiogroup" aria-label="Theme">
          <button data-theme-set="light" aria-label="Light theme"><span class="ms">light_mode</span></button>
          <button data-theme-set="system" aria-label="Match system"><span class="ms">contrast</span></button>
          <button data-theme-set="dark" aria-label="Dark theme"><span class="ms">dark_mode</span></button>
        </div>
      </footer>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="stage" id="stage">
      <div class="topbar">
        <div class="row">
          <button class="tbtn tablet-only" id="openMap"><span class="ms">menu</span>Screens</button>
          <button class="tbtn" id="back"><span class="ms">arrow_back</span>Back</button>
        </div>
        <div class="crumb" id="crumb"></div>
      </div>
      <div class="holder" id="holder">
        <div class="phone" id="phone">
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
