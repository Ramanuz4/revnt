<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBFAF8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="REVNT — rent quality riding gear near you, or list your own. Gear up. Ride out.">
  <title>REVNT — Gear up. Ride out.</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,100..125,400..900;1,100..125,700..900&family=Istok+Web:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,200..700,0..1,0&display=block">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    /* apply saved theme before paint to avoid a flash */
    try { var t = localStorage.getItem('revnt-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    document.documentElement.classList.add('js-reveal');
  </script>
</head>
<body>
  <a class="sr" href="#view">Skip to content</a>

  <!-- intro loader -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="lines"><i style="top:22%;animation-delay:.1s"></i><i style="top:38%;animation-delay:.5s"></i><i style="top:61%;animation-delay:.25s"></i><i style="top:78%;animation-delay:.7s"></i></div>
    <img src="assets/logo.png" alt="">
    <div class="bar"><i></i></div>
  </div>

  <header class="nav" id="nav"></header>
  <header class="mhead" id="mhead"></header>

  <main id="view" tabindex="-1"></main>

  <footer class="footer" id="footer"></footer>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <div id="overlay"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
